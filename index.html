<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kişisel Araç Garajım</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
:root{
  --beton:#e9e8e4;
  --asfalt:#23262b;
  --asfalt-acik:#3a3e45;
  --sari:#f2b705;
  --beyaz:#fbfbf9;
  --kirmizi:#b3261e;
  --cizgi:#c9c7c0;
}
*{box-sizing:border-box;margin:0}
body{
  font-family:'Barlow',system-ui,sans-serif;
  background:var(--beton);
  color:var(--asfalt);
  min-height:100vh;
  line-height:1.5;
}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.01em}
[hidden]{display:none!important}

/* Giriş */
.giris{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--asfalt)}
.giris-kutu{background:var(--beyaz);padding:36px 32px;width:100%;max-width:400px;border-top:8px solid var(--sari);border-radius:4px}
.giris-kutu h1{font-size:2.4rem;line-height:1.05;margin-bottom:10px}
.giris-kutu p{margin-bottom:22px;color:var(--asfalt-acik)}

/* Üst bar */
.ust{
  background:var(--asfalt);color:var(--beyaz);
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:20px 32px;border-bottom:6px solid var(--sari);
}
.ust h1{font-size:2.1rem;line-height:1}
.ust p{color:#d4d3cd;margin-top:4px}

/* Düzen */
.ana{display:grid;grid-template-columns:320px 1fr;gap:28px;padding:28px 32px;max-width:1150px;margin:0 auto;align-items:start}
.panel{background:var(--beyaz);padding:24px;border:2px solid var(--asfalt);border-radius:4px;position:sticky;top:16px}
.panel h2{font-size:1.6rem;margin-bottom:14px}

/* Form */
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select{
  width:100%;padding:10px 12px;font:inherit;background:#fff;
  border:2px solid var(--cizgi);border-radius:3px;color:var(--asfalt);
}
input:focus,select:focus,.btn:focus-visible,.filtre:focus-visible,.ikon-btn:focus-visible{
  outline:3px solid var(--sari);outline-offset:1px;border-color:var(--asfalt);
}
.hata{color:var(--kirmizi);font-size:.9rem;min-height:1.3em;margin-top:10px;font-weight:600}
.form-butonlar{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}

/* Butonlar */
.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:3px;border:2px solid var(--asfalt);cursor:pointer}
.btn-ana{background:var(--sari);color:var(--asfalt)}
.btn-ana:hover{background:#ffc928}
.btn-ikinci{background:transparent;color:inherit;border-color:currentColor}
.ust .btn-ikinci{color:var(--beyaz)}
.btn-ikinci:hover{background:rgba(128,128,128,.18)}
.giris-kutu .btn{width:100%;margin-top:18px}

/* Araç çubuğu */
.arac-cubugu{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.filtreler{display:flex;border:2px solid var(--asfalt);border-radius:3px;overflow:hidden}
.filtre{font:inherit;font-weight:600;background:var(--beyaz);border:0;padding:9px 18px;cursor:pointer}
.filtre.aktif{background:var(--asfalt);color:var(--beyaz)}
#arama{max-width:240px}
.sayac{margin:14px 0;color:var(--asfalt-acik);font-size:.95rem}

/* Kartlar */
.arac-listesi{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.kart{background:var(--beyaz);border:2px solid var(--asfalt);border-radius:4px;display:flex;flex-direction:column}
.kart.favori{box-shadow:6px 6px 0 var(--sari)}
.kart-ust{padding:18px 18px 10px}
.marka{font-size:.9rem;font-weight:600;color:var(--asfalt-acik)}
.model{font-size:2rem;line-height:1.05;word-break:break-word}
.plaka{
  display:inline-flex;margin-top:12px;border:2px solid var(--asfalt);border-radius:3px;overflow:hidden;font-weight:700;
}
.plaka span{padding:3px 10px}
.plaka .yil{background:var(--asfalt);color:var(--beyaz)}
.kart-alt{margin-top:auto;display:flex;border-top:2px solid var(--asfalt)}
.ikon-btn{
  flex:1;font:inherit;font-weight:600;padding:10px 6px;background:var(--beyaz);
  border:0;border-right:2px solid var(--asfalt);cursor:pointer;
}
.ikon-btn:last-child{border-right:0}
.ikon-btn:hover{background:var(--beton)}
.ikon-btn.sil:hover{background:var(--kirmizi);color:#fff}
.ikon-btn.fav-aktif{background:var(--sari)}

.bos{margin-top:30px;padding:36px 20px;text-align:center;border:2px dashed var(--asfalt-acik);border-radius:4px;color:var(--asfalt-acik)}

/* Mobil */
@media (max-width:820px){
  .ana{grid-template-columns:1fr;padding:20px 16px}
  .panel{position:static}
  .ust{padding:16px}
  #arama{max-width:none;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>

  <!-- Kullanıcı adı ekranı -->
  <section id="girisEkrani" class="giris">
    <form id="kullaniciForm" class="giris-kutu">
      <h1>Kişisel Araç Garajım</h1>
      <p>Garajına girmek için bir kullanıcı adı belirle.</p>
      <label for="kullaniciAdi">Kullanıcı adı</label>
      <input type="text" id="kullaniciAdi" maxlength="20" placeholder="Örn. Ahmet" required>
      <button type="submit" class="btn btn-ana">Garaja gir</button>
    </form>
  </section>

  <!-- Ana uygulama -->
  <div id="uygulama" hidden>
    <header class="ust">
      <div>
        <h1>Kişisel Araç Garajım</h1>
        <p id="karsilama"></p>
      </div>
      <button id="cikisBtn" class="btn btn-ikinci" type="button">Kullanıcıyı değiştir</button>
    </header>

    <main class="ana">
      <!-- Form -->
      <aside class="panel">
        <h2 id="formBaslik">Yeni araç ekle</h2>
        <form id="aracForm" novalidate>
          <input type="hidden" id="aracId">

          <label for="marka">Marka</label>
          <input type="text" id="marka" placeholder="Örn. Renault">

          <label for="model">Model</label>
          <input type="text" id="model" placeholder="Örn. Clio">

          <label for="yil">Model yılı</label>
          <input type="number" id="yil" placeholder="Örn. 2019" min="1950" max="2035">

          <label for="yakit">Yakıt türü</label>
          <select id="yakit">
            <option value="">Seçiniz</option>
            <option>Benzin</option>
            <option>Dizel</option>
            <option>LPG</option>
            <option>Hibrit</option>
            <option>Elektrik</option>
          </select>

          <p id="hata" class="hata" role="alert"></p>

          <div class="form-butonlar">
            <button type="submit" id="kaydetBtn" class="btn btn-ana">Aracı ekle</button>
            <button type="button" id="iptalBtn" class="btn btn-ikinci" hidden>Vazgeç</button>
          </div>
        </form>
      </aside>

      <!-- Liste -->
      <section class="liste-alani">
        <div class="arac-cubugu">
          <div class="filtreler">
            <button class="filtre aktif" data-filtre="tumu" type="button">Tümü</button>
            <button class="filtre" data-filtre="favori" type="button">Favoriler</button>
          </div>
          <input type="search" id="arama" placeholder="Marka veya model ara">
        </div>
        <p id="sayac" class="sayac"></p>
        <div id="aracListesi" class="arac-listesi"></div>
        <p id="bosMesaj" class="bos" hidden></p>
      </section>
    </main>
  </div>

  <script>
// ---------- Değişkenler ----------
const ANAHTAR_ARAC = "garajAraclar";
const ANAHTAR_KULLANICI = "garajKullanici";

let araclar = JSON.parse(localStorage.getItem(ANAHTAR_ARAC)) || [];
let aktifFiltre = "tumu";

const girisEkrani = document.getElementById("girisEkrani");
const uygulama = document.getElementById("uygulama");
const kullaniciForm = document.getElementById("kullaniciForm");
const kullaniciAdi = document.getElementById("kullaniciAdi");
const karsilama = document.getElementById("karsilama");
const cikisBtn = document.getElementById("cikisBtn");

const aracForm = document.getElementById("aracForm");
const aracId = document.getElementById("aracId");
const marka = document.getElementById("marka");
const model = document.getElementById("model");
const yil = document.getElementById("yil");
const yakit = document.getElementById("yakit");
const hata = document.getElementById("hata");
const formBaslik = document.getElementById("formBaslik");
const kaydetBtn = document.getElementById("kaydetBtn");
const iptalBtn = document.getElementById("iptalBtn");

const aracListesi = document.getElementById("aracListesi");
const bosMesaj = document.getElementById("bosMesaj");
const sayac = document.getElementById("sayac");
const arama = document.getElementById("arama");

// ---------- Kullanıcı ----------
function kullaniciyiGoster() {
  const ad = localStorage.getItem(ANAHTAR_KULLANICI);
  if (ad) {
    girisEkrani.hidden = true;
    uygulama.hidden = false;
    karsilama.textContent = "Hoş geldin, " + ad + ". Garajında " + araclar.length + " araç var.";
    listele();
  } else {
    girisEkrani.hidden = false;
    uygulama.hidden = true;
    kullaniciAdi.focus();
  }
}

kullaniciForm.addEventListener("submit", function (e) {
  e.preventDefault();
  const ad = kullaniciAdi.value.trim();
  if (!ad) return;
  localStorage.setItem(ANAHTAR_KULLANICI, ad);
  kullaniciyiGoster();
});

cikisBtn.addEventListener("click", function () {
  localStorage.removeItem(ANAHTAR_KULLANICI);
  kullaniciAdi.value = "";
  kullaniciyiGoster();
});

// ---------- Kaydetme ----------
function kaydet() {
  localStorage.setItem(ANAHTAR_ARAC, JSON.stringify(araclar));
}

// ---------- Ekle / Düzenle ----------
aracForm.addEventListener("submit", function (e) {
  e.preventDefault();
  const m = marka.value.trim();
  const mo = model.value.trim();
  const y = Number(yil.value);
  const yk = yakit.value;

  if (!m || !mo || !yil.value || !yk) {
    hata.textContent = "Marka, model, model yılı ve yakıt türünü doldurun.";
    return;
  }
  if (y < 1950 || y > 2035) {
    hata.textContent = "Model yılı 1950 ile 2035 arasında olmalı.";
    return;
  }
  hata.textContent = "";

  if (aracId.value) {
    // Düzenleme
    const arac = araclar.find(function (a) { return a.id === Number(aracId.value); });
    arac.marka = m;
    arac.model = mo;
    arac.yil = y;
    arac.yakit = yk;
  } else {
    // Yeni ekleme
    araclar.push({ id: Date.now(), marka: m, model: mo, yil: y, yakit: yk, favori: false });
  }

  kaydet();
  formuSifirla();
  kullaniciyiGoster();
});

function formuSifirla() {
  aracForm.reset();
  aracId.value = "";
  hata.textContent = "";
  formBaslik.textContent = "Yeni araç ekle";
  kaydetBtn.textContent = "Aracı ekle";
  iptalBtn.hidden = true;
}
iptalBtn.addEventListener("click", formuSifirla);

// ---------- Listeleme ----------
function listele() {
  const aranan = arama.value.trim().toLowerCase();

  const gosterilecek = araclar.filter(function (a) {
    const filtreUyar = aktifFiltre === "tumu" || a.favori;
    const metin = (a.marka + " " + a.model).toLowerCase();
    return filtreUyar && metin.includes(aranan);
  });

  aracListesi.innerHTML = "";

  gosterilecek.forEach(function (a) {
    const kart = document.createElement("article");
    kart.className = "kart" + (a.favori ? " favori" : "");

    const ust = document.createElement("div");
    ust.className = "kart-ust";
    ust.innerHTML =
      '<p class="marka"></p><h3 class="model"></h3>' +
      '<div class="plaka"><span class="yil"></span><span class="yakit"></span></div>';
    // textContent ile güvenli yazım
    ust.querySelector(".marka").textContent = a.marka;
    ust.querySelector(".model").textContent = a.model;
    ust.querySelector(".yil").textContent = a.yil;
    ust.querySelector(".yakit").textContent = a.yakit;

    const alt = document.createElement("div");
    alt.className = "kart-alt";
    alt.innerHTML =
      '<button class="ikon-btn fav' + (a.favori ? " fav-aktif" : "") + '" type="button" aria-pressed="' + a.favori + '">' +
      (a.favori ? "★ Favoride" : "☆ Favori") + '</button>' +
      '<button class="ikon-btn duzenle" type="button">Düzenle</button>' +
      '<button class="ikon-btn sil" type="button">Sil</button>';

    alt.querySelector(".fav").addEventListener("click", function () { favoriDegistir(a.id); });
    alt.querySelector(".duzenle").addEventListener("click", function () { duzenle(a.id); });
    alt.querySelector(".sil").addEventListener("click", function () { sil(a.id); });

    kart.appendChild(ust);
    kart.appendChild(alt);
    aracListesi.appendChild(kart);
  });

  sayac.textContent = gosterilecek.length + " araç gösteriliyor";

  if (araclar.length === 0) {
    bosMesaj.textContent = "Garajın boş. Soldaki formdan ilk aracını ekle.";
    bosMesaj.hidden = false;
  } else if (gosterilecek.length === 0) {
    bosMesaj.textContent = aktifFiltre === "favori" && !aranan
      ? "Henüz favori aracın yok. Bir kartta \u201CFavori\u201D düğmesine bas."
      : "Aramana uyan araç bulunamadı.";
    bosMesaj.hidden = false;
  } else {
    bosMesaj.hidden = true;
  }

  const ad = localStorage.getItem(ANAHTAR_KULLANICI);
  if (ad) karsilama.textContent = "Hoş geldin, " + ad + ". Garajında " + araclar.length + " araç var.";
}

// ---------- İşlemler ----------
function favoriDegistir(id) {
  const arac = araclar.find(function (a) { return a.id === id; });
  arac.favori = !arac.favori;
  kaydet();
  listele();
}

function duzenle(id) {
  const arac = araclar.find(function (a) { return a.id === id; });
  aracId.value = arac.id;
  marka.value = arac.marka;
  model.value = arac.model;
  yil.value = arac.yil;
  yakit.value = arac.yakit;
  formBaslik.textContent = "Aracı düzenle";
  kaydetBtn.textContent = "Değişiklikleri kaydet";
  iptalBtn.hidden = false;
  marka.focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function sil(id) {
  const arac = araclar.find(function (a) { return a.id === id; });
  if (!confirm(arac.marka + " " + arac.model + " aracı silinsin mi?")) return;
  araclar = araclar.filter(function (a) { return a.id !== id; });
  kaydet();
  if (Number(aracId.value) === id) formuSifirla();
  listele();
}

// ---------- Filtre ve arama ----------
document.querySelectorAll(".filtre").forEach(function (btn) {
  btn.addEventListener("click", function () {
    document.querySelectorAll(".filtre").forEach(function (b) { b.classList.remove("aktif"); });
    btn.classList.add("aktif");
    aktifFiltre = btn.dataset.filtre;
    listele();
  });
});
arama.addEventListener("input", listele);

// ---------- Başlat ----------
kullaniciyiGoster();

</script>
</body>
</html>
